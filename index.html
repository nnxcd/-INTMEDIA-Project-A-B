<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project A-B</title>
    <style>
        body {
            font-family:sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000; /* Dark fallback while image loads */
            overflow: hidden; /* Prevents unwanted scrollbars */
        }

        .main-content {
            /* Force the container to fill the exact size of the browser window */
            width: 100vw;
            height: 100vh;
            
            /* Apply the background styling directly here 
            background-image: url('Images/testing-bg.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center; */
            
            /* Use Flexbox to flawlessly center all children elements */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1; /* Ensure it stays above the canvas */
        }

        .overlay-text {
            padding:20px;
            /* Text centering rules */
            text-align: center;
            color: rgb(0, 0, 0);
            background-color: white;
            z-index: 5;
        }

        /* Subtle button styling to make it stand out */
        #start-btn {
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 15px;
        }
        
        canvas { 
            width: 100%; 
            height: 100vh; 
        }
    </style>
</head>
<body>
    <div id="html-screen" class="main-content">
        <!--<img src="Images/testing-bg.jpg" alt="background image"> -->
        <div class="overlay-text">
            <h1>You'll make some memories here</h1>
            <button id="start-btn">welcome home</button>
        </div>
    </div>
    


<!-- Leave this alone prolly -->
<canvas id="renderCanvas" style="display: none;"></canvas>

</body>
</html>
