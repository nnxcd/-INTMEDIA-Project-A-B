<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fig tree</title>

    <style>
        /* One block per font file */
        @font-face {
            font-family: 'mieszkanie9';
            src: url('Fonts/mieszkanie9.otf');
        }

        @font-face {
            font-family: 'DeFonte';
            font-weight: 600; /* DemiGras = semi-bold */
            src: url('Fonts/DeFonte reduced DemiGras.ttf');
        }

        @font-face {
            font-family: 'DeFonte';
            font-weight: 700; /* Gros = heavy/bold */
            src: url('Fonts/DeFonte reduced Gros.ttf');
        }

        @font-face {
            font-family: 'DeFonte';
            font-weight: 300; /* Leger = light */
            src: url('Fonts/DeFonte reduced Leger.ttf');
        }

        @font-face {
            font-family: 'DeFonte';
            font-weight: 400; /* Normale = regular */
            src: url('Fonts/DeFonte reduced Normale.ttf');
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family:Arial, Helvetica, sans-serif;
        }

        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        .background-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            
        }

        .dvd-menu {
            display: flex;
            flex-direction: column;
            align-items: center;      /* keeps h1 centered */
            justify-content: center;
            min-height: 80vh;
        }


        .dvd-menu h1 {
            font-family: 'Defonte';
            font-weight: 600;
            font-size: 40px;
            filter:blur(1px);
            margin-bottom: 40px;
            color: rgb(175, 203, 132);
            /*-webkit-text-stroke: 0.7px black;*/
            /*text-shadow:  
                1px 1px 5px rgb(255, 255, 255),
                -1px -1px 7px rgb(255, 255, 255);*/
        }

        .dvd-menu-items h2 {
            
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            font-family: 'DeFonte';
            font-weight: 400;
            margin: 10px 0;
            text-align: left;
            line-height: 1.5;
            letter-spacing: -1px;
            transform: scaleY(1.2);
            padding-left: 40px; /* extra space to make room for the star */
            position: relative;
            cursor: pointer;
        }

/* star is hidden by default */
        .dvd-menu-items h2::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
            width: 30px;
            height: 30px;
            background-image: url('Images/menu-arrow.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0;

        }

        /* star appears on hover */
        .dvd-menu-items h2:hover::before {
            opacity: 1;
        }

        a{
            color:black;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="background-image">
        <img src="Images/new-bg-menu.png" alt="background to dvd menu">
    </div>
    <div class="dvd-menu">
        <h1> Eternal sunshine of the spotless mind </h1>
        <div class="dvd-menu-items">
            <h2> <a href="before-fig-tree.html"> Start</a></h2>
            <h2> <a href="room.html"> End </a></h2>
        </div>
        
    </div>
    <audio id="introAudio" src="music/parfum-intro.mp3" preload="auto" autoplay loop></audio>
    <script>
        window.addEventListener('load', function() {
            const audio = document.getElementById('introAudio');
            if (audio && audio.paused) {
                audio.play().catch(() => {
                    // Autoplay may be blocked by the browser; user interaction is required.
                });
            }
        });
    </script>
</body>
</html>
