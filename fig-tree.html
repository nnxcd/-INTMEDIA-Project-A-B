<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fig tree</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #fff;
        }
        .tree {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        .tree img {
            width: 100%; height: 100%;
            object-fit: fill;
            display: block;
        }
        .fruits {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
        }
        .fruits img {
            width: 30%;
            height: auto;
            position: absolute;
            transition: transform 0.2s ease;
        }
        .fruits img:hover {
            cursor: pointer;
            animation: shake 0.5s infinite;
        }
        .fruits img.hand-shake {
            animation: shake 0.4s infinite;
        }
        @keyframes shake {
            0%   { transform: translate(1px, 1px)   rotate(0deg);  }
            10%  { transform: translate(-1px, -2px) rotate(-1deg); }
            20%  { transform: translate(-3px, 0px)  rotate(1deg);  }
            30%  { transform: translate(3px, 2px)   rotate(0deg);  }
            40%  { transform: translate(1px, -1px)  rotate(1deg);  }
            50%  { transform: translate(-1px, 2px)  rotate(-1deg); }
            60%  { transform: translate(-3px, 1px)  rotate(0deg);  }
            70%  { transform: translate(3px, 1px)   rotate(-1deg); }
            80%  { transform: translate(-1px, -1px) rotate(1deg);  }
            90%  { transform: translate(1px, 2px)   rotate(0deg);  }
            100% { transform: translate(1px, -2px)  rotate(-1deg); }
        }
        #p5-canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 50;
            pointer-events: none;
        }
        #p5-canvas-container canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100% !important;
            height: 100% !important;
        }
        #hand-status {
            position: fixed;
            bottom: 16px; right: 16px;
            z-index: 100;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-family: monospace;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 20px;
            pointer-events: none;
        }

        #fig1  { top: 10%; left: 45%; }
        #fig2  { top: 25%; left: 65%; }
        #fig3  { top: 60%; left: 10%; } /* bottom right */
        #fig4  { top: 30%; left: 8%; } /* top left */
        #fig5  { top: 60%; left: 55%; } /*bottom right*/
       
    </style>
</head>
<body>

    <div class="tree">
        <img src="Images/ascii-art.gif" alt="fig tree">
    </div>

    <div class="fruits">
        <img id="fig1"  src="Images/fig-1.PNG" alt="fig fruit 1">
        <img id="fig2"  src="Images/fig-2.PNG" alt="fig fruit 2">
        <img id="fig3"  src="Images/fig-3.PNG" alt="fig fruit 3">
        <img id="fig4"  src="Images/fig-1.PNG" alt="fig fruit 4">
        <img id="fig5"  src="Images/fig-2.PNG" alt="fig fruit 5">
        
    </div>

    <div id="p5-canvas-container"></div>
    <div id="hand-status">📷 Starting camera…</div>

    <script>
    new p5(function(p) {

        const VIDEO_W     = 640;
        const VIDEO_H     = 480;
        const SHAKE_RADIUS = 140;
        const TIP_INDICES  = [4, 8, 12, 16, 20];
        // How much to shrink the detected hand region (0.5 = half size)
        const HAND_SCALE  = 0.5;

        let handpose;
        let video;
        let predictions = [];
        let handImg;
        const statusEl = document.getElementById('hand-status');

        p.preload = function() {
            handImg = p.loadImage('Images/hand.png');
        };

        p.setup = function() {
            let cnv = p.createCanvas(window.innerWidth, window.innerHeight);
            cnv.parent('p5-canvas-container');

            video = p.createCapture(p.VIDEO);
            video.size(VIDEO_W, VIDEO_H);
            video.hide();

            handpose = ml5.handpose(video.elt, function() {
                statusEl.textContent = '✋ Hand tracking ready — show your hand!';
            });

            handpose.on('predict', function(results) {
                predictions = results;
            });
        };

        p.windowResized = function() {
            p.resizeCanvas(window.innerWidth, window.innerHeight);
        };

        p.draw = function() {
            p.clear();

            if (predictions.length === 0) {
                clearAllShake();
                return;
            }

            statusEl.textContent = '🖐 Hand detected (' + predictions.length + ')';

            let tips = [];

            for (let i = 0; i < predictions.length; i++) {
                let pred = predictions[i];
                if (!pred.landmarks) continue;

                // Scale landmarks from video space to screen space
                let allPts = [];
                for (let j = 0; j < pred.landmarks.length; j++) {
                    let lm = pred.landmarks[j];
                    allPts.push({
                        x: (lm[0] / VIDEO_W) * window.innerWidth,
                        y: (lm[1] / VIDEO_H) * window.innerHeight
                    });
                }

                // Full bounding box of all landmarks
                let xs = allPts.map(function(pt) { return pt.x; });
                let ys = allPts.map(function(pt) { return pt.y; });
                let minX = Math.min.apply(null, xs);
                let maxX = Math.max.apply(null, xs);
                let minY = Math.min.apply(null, ys);
                let maxY = Math.max.apply(null, ys);

                // Centre of the detected hand
                let cx = (minX + maxX) / 2;
                let cy = (minY + maxY) / 2;

                // Half-size: shrink the bounding region by HAND_SCALE
                let fullW = maxX - minX;
                let fullH = maxY - minY;
                let imgW = fullW * HAND_SCALE;
                let imgH = fullH * HAND_SCALE;

                // Draw hand-pointing.jpg centred on the hand's centre
                p.imageMode(p.CENTER);
                p.image(handImg, cx, cy, imgW, imgH);

                // Fingertips (still using full-scale coords for shake detection)
                for (let k = 0; k < TIP_INDICES.length; k++) {
                    let idx = TIP_INDICES[k];
                    if (allPts[idx]) tips.push(allPts[idx]);
                }
            }

            // Shake figs near any fingertip
            let figs = document.querySelectorAll('.fruits img');
            for (let f = 0; f < figs.length; f++) {
                let rect = figs[f].getBoundingClientRect();
                let fcx = rect.left + rect.width  / 2;
                let fcy = rect.top  + rect.height / 2;
                let near = false;
                for (let t = 0; t < tips.length; t++) {
                    let dx = tips[t].x - fcx;
                    let dy = tips[t].y - fcy;
                    if (Math.sqrt(dx*dx + dy*dy) < SHAKE_RADIUS) { near = true; break; }
                }
                figs[f].classList.toggle('hand-shake', near);
            }
        };

        function clearAllShake() {
            let figs = document.querySelectorAll('.fruits img');
            for (let f = 0; f < figs.length; f++) {
                figs[f].classList.remove('hand-shake');
            }
        }

    });
    </script>

</body>
</html>
