<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fig tree</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #fff;
            color:black;
        }
        .tree {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        .tree img {
            width: 100%; height: 100%;
            object-fit: fill;
            display: block;
        }
        .fruits {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
        }
        .fruits img {
            width: 8%;
            height: auto;
            position: absolute;
            transition: transform 0.2s ease;
        }
        .fruits img:hover {
            cursor: pointer;
            animation: shake 0.5s infinite;
        }
        .fruits img.hand-shake {
            animation: shake 0.4s infinite;
        }
        @keyframes shake {
            0%   { transform: translate(1px, 1px)   rotate(0deg);  }
            10%  { transform: translate(-1px, -2px) rotate(-1deg); }
            20%  { transform: translate(-3px, 0px)  rotate(1deg);  }
            30%  { transform: translate(3px, 2px)   rotate(0deg);  }
            40%  { transform: translate(1px, -1px)  rotate(1deg);  }
            50%  { transform: translate(-1px, 2px)  rotate(-1deg); }
            60%  { transform: translate(-3px, 1px)  rotate(0deg);  }
            70%  { transform: translate(3px, 1px)   rotate(-1deg); }
            80%  { transform: translate(-1px, -1px) rotate(1deg);  }
            90%  { transform: translate(1px, 2px)   rotate(0deg);  }
            100% { transform: translate(1px, -2px)  rotate(-1deg); }
        }
        #p5-canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 50;
            pointer-events: none;
        }
        #p5-canvas-container canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100% !important;
            height: 100% !important;
        }
        #hand-status {
            position: fixed;
            bottom: 16px; right: 16px;
            z-index: 100;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-family: monospace;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 20px;
            pointer-events: none;
        }

        #fig1  { top: 10%; left: 80%; }
        #fig2  { top: 35%; left: 45%; }
        #fig3  { top: 70%; left: 15%; }
        #fig4  { top: 10%; left: 12%; }
        #fig5  { top: 60%; left: 70%; }

        .fig-phrase {
            position: absolute;
            display: none;
            font-family: Arial, sans-serif;
            font-style: italic;
            font-size: clamp(13px, 1.3vw, 18px);
            color: #222;
            white-space: nowrap;
            pointer-events: none;
            z-index: 60;
            transform: translateX(-50%);
        }
        #fig1-phrase { top: calc(10% - 1.8em); left: 80%; }
        #fig2-phrase { top: calc(35% - 1.8em); left: 45%; }
        #fig3-phrase { top: calc(70% - 1.8em); left: 15%; }
        #fig4-phrase { top: calc(10% - 1.8em); left: 12%; }
        #fig5-phrase { top: calc(60% - 1.8em); left: 70%; }

        /* Progress ring */
        .fig-ring {
            position: absolute;
            display: none;
            pointer-events: none;
            z-index: 61;
            transform: translate(-50%, -50%);
        }
        .fig-ring svg {
            transform: rotate(-90deg);
        }
        .fig-ring .ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.15);
            stroke-width: 3;
        }
        .fig-ring .ring-fill {
            fill: none;
            stroke: rgb(79, 47, 87);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 94.25;
            stroke-dashoffset: 94.25;
            transition: stroke-dashoffset 0.05s linear;
        }

        #fig1-ring { top: calc(10% + 4%); left: calc(80% + 9%); }
        #fig2-ring { top: calc(35% + 4%); left: calc(45% + 9%); }
        #fig3-ring { top: calc(70% + 4%); left: calc(15% + 9%); }
        #fig4-ring { top: calc(10% + 4%); left: calc(12% + 9%); }
        #fig5-ring { top: calc(60% + 4%); left: calc(70% + 9%); }
    </style>
</head>
<body>

    <div class="tree">
        <img src="Images/ascii-art.gif" alt="fig tree">
    </div>

    <div class="fruits">
        <img id="fig1" src="Images/main-fig.png" alt="fig fruit 1">
        <img id="fig2" src="Images/main-fig.png" alt="fig fruit 2">
        <img id="fig3" src="Images/main-fig.png" alt="fig fruit 3">
        <img id="fig4" src="Images/main-fig.png" alt="fig fruit 4">
        <img id="fig5" src="Images/main-fig.png" alt="fig fruit 5">
    </div>

    <span id="fig1-phrase" class="fig-phrase">choose to be a gardener</span>
    <span id="fig2-phrase" class="fig-phrase">choose to be a chef</span>
    <span id="fig3-phrase" class="fig-phrase">choose to be an engineer</span>
    <span id="fig4-phrase" class="fig-phrase">choose to be a marine biologist</span>
    <span id="fig5-phrase" class="fig-phrase">choose to be a painter</span>

    <!-- Progress rings, one per fig -->
    <div id="fig1-ring" class="fig-ring"><svg width="32" height="32" viewBox="0 0 32 32"><circle class="ring-bg" cx="16" cy="16" r="15"/><circle class="ring-fill" cx="16" cy="16" r="15"/></svg></div>
    <div id="fig2-ring" class="fig-ring"><svg width="32" height="32" viewBox="0 0 32 32"><circle class="ring-bg" cx="16" cy="16" r="15"/><circle class="ring-fill" cx="16" cy="16" r="15"/></svg></div>
    <div id="fig3-ring" class="fig-ring"><svg width="32" height="32" viewBox="0 0 32 32"><circle class="ring-bg" cx="16" cy="16" r="15"/><circle class="ring-fill" cx="16" cy="16" r="15"/></svg></div>
    <div id="fig4-ring" class="fig-ring"><svg width="32" height="32" viewBox="0 0 32 32"><circle class="ring-bg" cx="16" cy="16" r="15"/><circle class="ring-fill" cx="16" cy="16" r="15"/></svg></div>
    <div id="fig5-ring" class="fig-ring"><svg width="32" height="32" viewBox="0 0 32 32"><circle class="ring-bg" cx="16" cy="16" r="15"/><circle class="ring-fill" cx="16" cy="16" r="15"/></svg></div>

    <div id="p5-canvas-container"></div>
    <div id="hand-status">Hover over a fig and pinch for 5 seconds to pick your future.</div>

    <script>
    const HOVER_DURATION = 5000; // ms
    const CIRCUMFERENCE = 2 * Math.PI * 15; // ~94.25

    const figSoundFiles = {
        fig1: 'music/ohayashi-first-ding.mp3',
        fig2: 'music/ohayashi-second-ding.mp3',
        fig3: 'music/ohayashi-third-ding.mp3',
        fig4: 'music/ohayashi-fourth-ding.mp3',
        fig5: 'music/ohayashi-fifth-ding.mp3'
    };

    const figAudio = {};
    Object.keys(figSoundFiles).forEach(function(id) {
        const audio = new Audio(figSoundFiles[id]);
        audio.preload = 'auto';
        figAudio[id] = audio;
    });

    var figIds = ['fig1','fig2','fig3','fig4','fig5'];
    var mouseHover = {};
    var handHover = {};
    var hoverActive = {};
    var hoverIntervals = {};

    function isHovering(id) {
        return mouseHover[id] || handHover[id];
    }

    function activateHover(id) {
        if (hoverActive[id]) return; // already visible
        var phrase = document.getElementById(id + '-phrase');
        var ring = document.getElementById(id + '-ring');
        var fill = ring.querySelector('.ring-fill');
        var sound = figAudio[id];
        if (sound) {
            sound.currentTime = 0;
            sound.play().catch(function() {
                // ignore autoplay or playback errors
            });
        }

        phrase.style.display = 'block';
        ring.style.display = 'block';

        var startTime = Date.now();
        fill.style.strokeDashoffset = CIRCUMFERENCE;

        hoverIntervals[id] = setInterval(function() {
            var elapsed = Date.now() - startTime;
            var progress = Math.min(elapsed / HOVER_DURATION, 1);
            fill.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);
            if (progress >= 1) {
                clearInterval(hoverIntervals[id]);
                hoverIntervals[id] = null;
                window.location.href = 'room.html';
            }
        }, 50);

        hoverActive[id] = true;
    }

    function deactivateHover(id) {
        if (!hoverActive[id]) return;
        var phrase = document.getElementById(id + '-phrase');
        var ring = document.getElementById(id + '-ring');
        var fill = ring.querySelector('.ring-fill');

        phrase.style.display = 'none';
        ring.style.display = 'none';
        fill.style.strokeDashoffset = CIRCUMFERENCE;

        if (hoverIntervals[id]) {
            clearInterval(hoverIntervals[id]);
            hoverIntervals[id] = null;
        }
        hoverActive[id] = false;
    }

    function updateHoverState(id) {
        if (isHovering(id)) {
            activateHover(id);
        } else {
            deactivateHover(id);
        }
    }

    // Mouse hover
    figIds.forEach(function(id) {
        var img = document.getElementById(id);
        img.addEventListener('mouseenter', function() {
            mouseHover[id] = true;
            updateHoverState(id);
        });
        img.addEventListener('mouseleave', function() {
            mouseHover[id] = false;
            updateHoverState(id);
        });
    });

    new p5(function(p) {

        const VIDEO_W     = 640;
        const VIDEO_H     = 480;
        const SHAKE_RADIUS = 140;
        const TIP_INDICES  = [4, 8, 12, 16, 20];
        const HAND_SCALE  = 0.2;

        let handpose;
        let video;
        let predictions = [];
        let handImg;
        const statusEl = document.getElementById('hand-status');

        p.preload = function() {
            handImg = p.loadImage('Images/mickey-mouse.png');
        };

        p.setup = function() {
            let cnv = p.createCanvas(window.innerWidth, window.innerHeight);
            cnv.parent('p5-canvas-container');

            video = p.createCapture(p.VIDEO);
            video.size(VIDEO_W, VIDEO_H);
            video.hide();

            handpose = ml5.handpose(video.elt, function() {
                statusEl.textContent = 'Hand tracking ready';
            });

            handpose.on('predict', function(results) {
                predictions = results;
            });
        };

        p.windowResized = function() {
            p.resizeCanvas(window.innerWidth, window.innerHeight);
        };

        p.draw = function() {
            p.clear();

            if (predictions.length === 0) {
                clearAllShake();
                return;
            }

            statusEl.textContent = '🖐 Hand detected (' + predictions.length + ')';

            let tips = [];

            for (let i = 0; i < predictions.length; i++) {
                let pred = predictions[i];
                if (!pred.landmarks) continue;

                let allPts = [];
                for (let j = 0; j < pred.landmarks.length; j++) {
                    let lm = pred.landmarks[j];
                    allPts.push({
                        x: (lm[0] / VIDEO_W) * window.innerWidth,
                        y: (lm[1] / VIDEO_H) * window.innerHeight
                    });
                }

                let xs = allPts.map(function(pt) { return pt.x; });
                let ys = allPts.map(function(pt) { return pt.y; });
                let minX = Math.min.apply(null, xs);
                let maxX = Math.max.apply(null, xs);
                let minY = Math.min.apply(null, ys);
                let maxY = Math.max.apply(null, ys);

                let cx = (minX + maxX) / 2;
                let cy = (minY + maxY) / 2;
                let fullW = maxX - minX;
                let fullH = maxY - minY;
                let imgW = fullW * HAND_SCALE;
                let imgH = fullH * HAND_SCALE;

                p.imageMode(p.CENTER);
                p.image(handImg, cx, cy, imgW, imgH);

                for (let k = 0; k < TIP_INDICES.length; k++) {
                    let idx = TIP_INDICES[k];
                    if (allPts[idx]) tips.push(allPts[idx]);
                }
            }

            let figs = document.querySelectorAll('.fruits img');
            for (let f = 0; f < figs.length; f++) {
                let rect = figs[f].getBoundingClientRect();
                let fcx = rect.left + rect.width  / 2;
                let fcy = rect.top  + rect.height / 2;
                let near = false;
                for (let t = 0; t < tips.length; t++) {
                    let dx = tips[t].x - fcx;
                    let dy = tips[t].y - fcy;
                    if (Math.sqrt(dx*dx + dy*dy) < SHAKE_RADIUS) { near = true; break; }
                }
                figs[f].classList.toggle('hand-shake', near);

                var id = figs[f].id;
                handHover[id] = near;
                updateHoverState(id);
            }
        };

        function clearAllShake() {
            let figs = document.querySelectorAll('.fruits img');
            for (let f = 0; f < figs.length; f++) {
                figs[f].classList.remove('hand-shake');
                var id = figs[f].id;
                handHover[id] = false;
                updateHoverState(id);
            }
        }

    });
    </script>

</body>
</html>
